services:
  backend:
    build:
      context: ./backend
      target: production
    container_name: ohara_backend
    restart: always
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - PORT=${PORT:-8080}
      - NODE_ENV=${NODE_ENV:-development}
      - DB_HOST=db
      - DB_PORT=5432
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ohara_network

  frontend:
    build:
      context: ./frontend
    container_name: ohara_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - ohara_network

  db:
    image: pgvector/pgvector:pg16
    container_name: ohara_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DOCKER_DB_PORT:-5434}:5432"
    volumes:
      - ohara_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ohara_network

volumes:
  ohara_postgres_data:

networks:
  ohara_network:
    driver: bridge
