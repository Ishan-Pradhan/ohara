# Run with:  docker compose --env-file ./backend/.env up --build
#
# The --env-file flag is required, not optional. `env_file:` below only injects
# variables INTO a container; the ${DB_USER}-style substitutions in this file
# are resolved by Compose itself, which reads the shell environment or a .env in
# this directory. There is deliberately no root .env (secrets live in
# backend/.env only), so without --env-file the db container starts with an
# empty POSTGRES_USER and fails.
services:
  backend:
    build:
      context: ./backend
      target: production
    container_name: ohara_backend
    restart: always
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - PORT=${PORT:-8080}
      # This service builds the production target, so pino-pretty (a devDependency)
      # is absent from the image. Defaulting to production keeps them consistent.
      - NODE_ENV=${NODE_ENV:-production}
      - DB_HOST=db
      - DB_PORT=5432
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ohara_network

  frontend:
    build:
      context: ./frontend
    container_name: ohara_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - ohara_network

  db:
    image: pgvector/pgvector:pg16
    container_name: ohara_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DOCKER_DB_PORT:-5434}:5432"
    volumes:
      - ohara_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ohara_network

volumes:
  ohara_postgres_data:

networks:
  ohara_network:
    driver: bridge
