server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single origin in production, mirroring the Vite proxy in development. The
  # backend's auth cookies are sameSite=strict, so the browser must see the API
  # and the app on one origin or the cookies are never sent.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback: every non-file route is handled by the client router.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
